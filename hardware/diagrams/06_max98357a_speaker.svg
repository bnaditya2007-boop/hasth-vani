<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" width="1040" height="640" font-family="Arial,Helvetica,sans-serif" stroke-linecap="round" stroke-linejoin="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs></defs><rect width="100%" height="100%" fill="#fff"/><text x="520.0" y="30.0" font-size="20" font-weight="700" text-anchor="middle" fill="#1c2430" >DIAGRAM 6: MAX98357A + ESP32 RIGHT + 3 W SPEAKER</text><rect x="80.0" y="110.0" width="260.0" height="300.0" rx="8" fill="#eef2fb" stroke="#1f2f5c" stroke-width="2.4" /><text x="210.0" y="132.0" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2f5c" >ESP32 RIGHT</text><rect x="640.0" y="110.0" width="250.0" height="300.0" rx="8" fill="#fff" stroke="#1c2430" stroke-width="2.2" /><text x="765.0" y="132.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1c2430" >MAX98357A I2S amp</text><circle cx="340.0" cy="170.0" r="3.6" fill="#d62828" stroke="none" stroke-width="1.5"/><text x="332.0" y="174.0" font-size="12.5" font-weight="700" text-anchor="end" fill="#1c2430" >5V / VBOOST</text><line x1="340.0" y1="170.0" x2="640.0" y2="170.0" stroke="#d62828" stroke-width="3.2" stroke-linecap="round" /><circle cx="640.0" cy="170.0" r="3.6" fill="#d62828" stroke="none" stroke-width="1.5"/><text x="650.0" y="174.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#1c2430" >VIN</text><text x="490.0" y="163.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#d62828" >supply (source PDF)</text><circle cx="340.0" cy="216.0" r="3.6" fill="#1b1b1b" stroke="none" stroke-width="1.5"/><text x="332.0" y="220.0" font-size="12.5" font-weight="700" text-anchor="end" fill="#1c2430" >GND</text><line x1="340.0" y1="216.0" x2="640.0" y2="216.0" stroke="#1b1b1b" stroke-width="3.2" stroke-linecap="round" /><circle cx="640.0" cy="216.0" r="3.6" fill="#1b1b1b" stroke="none" stroke-width="1.5"/><text x="650.0" y="220.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#1c2430" >GND</text><text x="490.0" y="209.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1b1b1b" >ground</text><circle cx="340.0" cy="262.0" r="3.6" fill="#7b2cbf" stroke="none" stroke-width="1.5"/><text x="332.0" y="266.0" font-size="12.5" font-weight="700" text-anchor="end" fill="#1c2430" >GPIO26</text><line x1="340.0" y1="262.0" x2="640.0" y2="262.0" stroke="#7b2cbf" stroke-width="3.2" stroke-linecap="round" /><circle cx="640.0" cy="262.0" r="3.6" fill="#7b2cbf" stroke="none" stroke-width="1.5"/><text x="650.0" y="266.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#1c2430" >BCLK</text><text x="490.0" y="255.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#7b2cbf" >bit clock</text><circle cx="340.0" cy="308.0" r="3.6" fill="#7b2cbf" stroke="none" stroke-width="1.5"/><text x="332.0" y="312.0" font-size="12.5" font-weight="700" text-anchor="end" fill="#1c2430" >GPIO25</text><line x1="340.0" y1="308.0" x2="640.0" y2="308.0" stroke="#7b2cbf" stroke-width="3.2" stroke-linecap="round" /><circle cx="640.0" cy="308.0" r="3.6" fill="#7b2cbf" stroke="none" stroke-width="1.5"/><text x="650.0" y="312.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#1c2430" >LRC / WS</text><text x="490.0" y="301.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#7b2cbf" >word select</text><circle cx="340.0" cy="354.0" r="3.6" fill="#7b2cbf" stroke="none" stroke-width="1.5"/><text x="332.0" y="358.0" font-size="12.5" font-weight="700" text-anchor="end" fill="#1c2430" >GPIO27</text><line x1="340.0" y1="354.0" x2="640.0" y2="354.0" stroke="#7b2cbf" stroke-width="3.2" stroke-linecap="round" /><circle cx="640.0" cy="354.0" r="3.6" fill="#7b2cbf" stroke="none" stroke-width="1.5"/><text x="650.0" y="358.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#1c2430" >DIN</text><text x="490.0" y="347.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#7b2cbf" >audio data</text><text x="650.0" y="392.0" font-size="11" font-weight="400" text-anchor="start" fill="#5f6b7a" >GAIN: open = 9 dB      SD: open = on</text><line x1="890.0" y1="200.0" x2="960.0" y2="200.0" stroke="#1c2430" stroke-width="3" stroke-linecap="round" /><text x="897.0" y="192.0" font-size="11" font-weight="700" text-anchor="start" fill="#1c2430" >OUT +</text><line x1="890.0" y1="250.0" x2="960.0" y2="250.0" stroke="#1c2430" stroke-width="3" stroke-linecap="round" /><text x="897.0" y="242.0" font-size="11" font-weight="700" text-anchor="start" fill="#1c2430" >OUT -</text><rect x="960.0" y="180.0" width="40.0" height="90.0" rx="4" fill="#fff" stroke="#1c2430" stroke-width="2.2" /><polygon points="1000,180 1030,150 1030,300 1000,270" fill="#fff" stroke="#1c2430" stroke-width="2.2"/><text x="1000.0" y="320.0" font-size="12" font-weight="700" text-anchor="middle" fill="#1c2430" >3 W speaker</text><text x="1000.0" y="336.0" font-size="11" font-weight="400" text-anchor="middle" fill="#5f6b7a" >(4-8 ohm)</text><rect x="640.0" y="420.0" width="380.0" height="90.0" rx="6" fill="#fff0f0" stroke="#c1121f" stroke-width="2" /><text x="650.0" y="440.0" font-size="13" font-weight="700" text-anchor="start" fill="#c1121f" >WARNING</text><text x="650.0" y="458.0" font-size="12" font-weight="400" text-anchor="start" fill="#c1121f" >DO NOT CONNECT SPEAKER OUTPUT TO GND</text><text x="650.0" y="473.8" font-size="12" font-weight="400" text-anchor="start" fill="#c1121f" >Both speaker leads go ONLY to the amplifier</text><text x="650.0" y="489.7" font-size="12" font-weight="400" text-anchor="start" fill="#c1121f" >OUT + / OUT - terminals. The output is bridged</text><text x="650.0" y="505.5" font-size="12" font-weight="400" text-anchor="start" fill="#c1121f" >(BTL): a lead to GND can damage the amplifier.</text><rect x="40.0" y="420.0" width="580.0" height="90.0" rx="6" fill="#eef4ff" stroke="#1d4ed8" stroke-width="2" /><text x="50.0" y="440.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#1d4ed8" >SOURCE-DOCUMENT CONNECTIONS</text><text x="50.0" y="458.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1c2430" >Source PDF (Figure 12): BCLK GPIO26, LRC GPIO25, DIN GPIO27; amp VIN from 5V / VBOOST.</text><text x="50.0" y="473.2" font-size="11.5" font-weight="400" text-anchor="start" fill="#1c2430" >These GPIOs are free outputs, not used by the flex sensors or MPU6050.</text><rect x="40.0" y="522.0" width="980.0" height="96.0" rx="6" fill="#fff7e0" stroke="#8a5a00" stroke-width="2" /><text x="50.0" y="542.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#8a5a00" >VERIFY ON ACTUAL MODULE</text><text x="50.0" y="560.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#8a5a00" >Exact pin labels on YOUR MAX98357A board can differ (VIN/VDD, LRC/LRCLK/WS, SD/SD_MODE, GAIN). VERIFY before wiring.</text><text x="50.0" y="575.2" font-size="11.5" font-weight="400" text-anchor="start" fill="#8a5a00" >Amp supply: datasheet range is about 2.7 V - 5.5 V; the source PDF feeds it from 5 V. Speaker polarity/impedance: VERIFY (4-8 ohm, 3 W).</text><text x="50.0" y="590.4" font-size="11.5" font-weight="400" text-anchor="start" fill="#8a5a00" >Test with a known audio tone before adding gesture recognition (build plan step 35).</text></svg>