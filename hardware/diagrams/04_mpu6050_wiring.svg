<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Arial,Helvetica,sans-serif" stroke-linecap="round" stroke-linejoin="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs></defs><rect width="100%" height="100%" fill="#fff"/><text x="500.0" y="30.0" font-size="20" font-weight="700" text-anchor="middle" fill="#1c2430" >DIAGRAM 4: MPU6050 + ESP32 (I2C)   -   same wiring on both gloves</text><rect x="120.0" y="110.0" width="250.0" height="300.0" rx="8" fill="#eef2fb" stroke="#1f2f5c" stroke-width="2.4" /><text x="245.0" y="132.0" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2f5c" >ESP32 (each glove)</text><rect x="640.0" y="110.0" width="250.0" height="300.0" rx="8" fill="#fff" stroke="#1c2430" stroke-width="2.2" /><text x="765.0" y="132.0" font-size="15" font-weight="700" text-anchor="middle" fill="#1c2430" >MPU6050 module</text><text x="765.0" y="150.0" font-size="11" font-weight="400" text-anchor="middle" fill="#5f6b7a" >(GY-521 style board)</text><circle cx="370.0" cy="190.0" r="3.6" fill="#d62828" stroke="none" stroke-width="1.5"/><text x="362.0" y="194.0" font-size="13" font-weight="700" text-anchor="end" fill="#1c2430" >3V3</text><line x1="370.0" y1="190.0" x2="640.0" y2="190.0" stroke="#d62828" stroke-width="3.4" stroke-linecap="round" /><circle cx="640.0" cy="190.0" r="3.6" fill="#d62828" stroke="none" stroke-width="1.5"/><text x="650.0" y="194.0" font-size="13" font-weight="700" text-anchor="start" fill="#1c2430" >VCC</text><text x="505.0" y="182.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#d62828" >3.3 V wire</text><circle cx="370.0" cy="235.0" r="3.6" fill="#1b1b1b" stroke="none" stroke-width="1.5"/><text x="362.0" y="239.0" font-size="13" font-weight="700" text-anchor="end" fill="#1c2430" >GND</text><line x1="370.0" y1="235.0" x2="640.0" y2="235.0" stroke="#1b1b1b" stroke-width="3.4" stroke-linecap="round" /><circle cx="640.0" cy="235.0" r="3.6" fill="#1b1b1b" stroke="none" stroke-width="1.5"/><text x="650.0" y="239.0" font-size="13" font-weight="700" text-anchor="start" fill="#1c2430" >GND</text><text x="505.0" y="227.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1b1b1b" >GND wire</text><circle cx="370.0" cy="280.0" r="3.6" fill="#1d5fd1" stroke="none" stroke-width="1.5"/><text x="362.0" y="284.0" font-size="13" font-weight="700" text-anchor="end" fill="#1c2430" >GPIO21 (SDA)</text><line x1="370.0" y1="280.0" x2="640.0" y2="280.0" stroke="#1d5fd1" stroke-width="3.4" stroke-linecap="round" /><circle cx="640.0" cy="280.0" r="3.6" fill="#1d5fd1" stroke="none" stroke-width="1.5"/><text x="650.0" y="284.0" font-size="13" font-weight="700" text-anchor="start" fill="#1c2430" >SDA</text><text x="505.0" y="272.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1d5fd1" >I2C data wire</text><circle cx="370.0" cy="325.0" r="3.6" fill="#1d5fd1" stroke="none" stroke-width="1.5"/><text x="362.0" y="329.0" font-size="13" font-weight="700" text-anchor="end" fill="#1c2430" >GPIO22 (SCL)</text><line x1="370.0" y1="325.0" x2="640.0" y2="325.0" stroke="#1d5fd1" stroke-width="3.4" stroke-linecap="round" /><circle cx="640.0" cy="325.0" r="3.6" fill="#1d5fd1" stroke="none" stroke-width="1.5"/><text x="650.0" y="329.0" font-size="13" font-weight="700" text-anchor="start" fill="#1c2430" >SCL</text><text x="505.0" y="317.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1d5fd1" >I2C clock wire</text><text x="650.0" y="375.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#5f6b7a" >AD0  -&gt;  GND  (address 0x68)</text><text x="650.0" y="392.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#5f6b7a" >INT  -&gt;  not used</text><rect x="40.0" y="430.0" width="460.0" height="110.0" rx="6" fill="#eef4ff" stroke="#1d4ed8" stroke-width="2" /><text x="50.0" y="450.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#1d4ed8" >SOURCE-DOCUMENT CONNECTIONS</text><text x="50.0" y="468.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1c2430" >Pins in the source PDF (Figure 8): ESP32 GPIO21 = SDA, GPIO22 = SCL.</text><text x="50.0" y="483.2" font-size="11.5" font-weight="400" text-anchor="start" fill="#1c2430" >I2C address 0x68 (AD0 low) or 0x69 (AD0 high).</text><text x="50.0" y="498.4" font-size="11.5" font-weight="400" text-anchor="start" fill="#1c2430" >Keep the four wires short and twisted.</text><text x="50.0" y="513.5" font-size="11.5" font-weight="400" text-anchor="start" fill="#1c2430" >The order of pins on YOUR module can differ.</text><rect x="520.0" y="430.0" width="440.0" height="110.0" rx="6" fill="#fff7e0" stroke="#8a5a00" stroke-width="2" /><text x="530.0" y="450.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#8a5a00" >VERIFY ON ACTUAL MODULE</text><text x="530.0" y="468.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#8a5a00" >Check the silkscreen for VCC / GND / SCL / SDA on the actual board.</text><text x="530.0" y="483.2" font-size="11.5" font-weight="400" text-anchor="start" fill="#8a5a00" >Confirm the module accepts 3.3 V on VCC (most GY-521 boards do).</text><text x="530.0" y="498.4" font-size="11.5" font-weight="400" text-anchor="start" fill="#8a5a00" >On-board I2C pull-up resistors: VERIFY they exist on your module.</text><text x="530.0" y="513.5" font-size="11.5" font-weight="400" text-anchor="start" fill="#8a5a00" >Mount flat on the back of the hand; axis arrows are printed on the board.</text><text x="120.0" y="80.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#5f6b7a" >WIRE COLOUR CODE (every wire is also text-labelled)</text><line x1="120.0" y1="96.0" x2="146.0" y2="96.0" stroke="#d62828" stroke-width="4" stroke-linecap="round" /><text x="152.0" y="100.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1c2430" >3.3 V</text><line x1="206.0" y1="96.0" x2="232.0" y2="96.0" stroke="#1b1b1b" stroke-width="4" stroke-linecap="round" /><text x="238.0" y="100.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1c2430" >GND</text><line x1="278.4" y1="96.0" x2="304.4" y2="96.0" stroke="#1d5fd1" stroke-width="4" stroke-linecap="round" /><text x="310.4" y="100.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1c2430" >I2C</text></svg>