11" font-weight="700" text-anchor="middle" fill="#1c2430" >1</text><circle cx="240.0" cy="330.0" r="11" fill="#fff" stroke="#1c2430" stroke-width="1.8"/><text x="240.0" y="334.0" font-size="11" font-weight="700" text-anchor="middle" fill="#1c2430" >3</text><circle cx="135.0" cy="392.0" r="11" fill="#fff" stroke="#1c2430" stroke-width="1.8"/><text x="135.0" y="396.0" font-size="11" font-weight="700" text-anchor="middle" fill="#1c2430" >4</text><circle cx="212.0" cy="344.0" r="11" fill="#fff" stroke="#1c2430" stroke-width="1.8"/><text x="212.0" y="348.0" font-size="11" font-weight="700" text-anchor="middle" fill="#1c2430" >6</text><circle cx="730.0" cy="190.0" r="11" fill="#fff" stroke="#1c2430" stroke-width="1.8"/><text x="730.0" y="194.0" font-size="11" font-weight="700" text-anchor="middle" fill="#1c2430" >1</text><circle cx="735.0" cy="392.0" r="11" fill="#fff" stroke="#1c2430" stroke-width="1.8"/><text x="735.0" y="396.0" font-size="11" font-weight="700" text-anchor="middle" fill="#1c2430" >4</text><circle cx="112.0" cy="305.0" r="11" fill="#fff" stroke="#1c2430" stroke-width="1.8"/><text x="112.0" y="309.0" font-size="11" font-weight="700" text-anchor="middle" fill="#1c2430" >2</text><circle cx="238.0" cy="214.0" r="11" fill="#fff" stroke="#1c2430" stroke-width="1.8"/><text x="238.0" y="218.0" font-size="11" font-weight="700" text-anchor="middle" fill="#1c2430" >5</text></g><text x="40.0" y="618.0" font-size="12" font-weight="400" text-anchor="start" fill="#1c2430" >1  Flex wires run along the back of each finger, never across a knuckle crease.</text><text x="40.0" y="640.0" font-size="12" font-weight="400" text-anchor="start" fill="#1c2430" >2  Red circles = strain relief: a loop of slack + tape/hot glue at every sensor base.</text><text x="40.0" y="662.0" font-size="12" font-weight="400" text-anchor="start" fill="#1c2430" >3  Bundle the 5 signal wires (green) into one harness down the centre of the hand.</text><text x="40.0" y="684.0" font-size="12" font-weight="400" text-anchor="start" fill="#1c2430" >4  ESP32 + battery sit on the wrist cuff: flat, not over the wrist bend.</text><text x="40.0" y="706.0" font-size="12" font-weight="400" text-anchor="start" fill="#1c2430" >5  Velcro / screws on perfboard: boards stay removable until the final test.</text><text x="40.0" y="728.0" font-size="12" font-weight="400" text-anchor="start" fill="#1c2430" >6  Heat-shrink or Kapton over every solder joint; no bare metal touches skin.</text><text x="40.0" y="750.0" font-size="12" font-weight="400" text-anchor="start" fill="#1c2430" >7  MPU6050 lies flat on the back of the hand; axis arrows on the board must be checked.</text><text x="40.0" y="772.0" font-size="12" font-weight="400" text-anchor="start" fill="#1c2430" >8  Speaker outlet must not be covered by the glove; leads only to amp OUT + / OUT -.</text><text x="40.0" y="810.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#5f6b7a" >Source: build-plan PDF Figure 16 and steps 53-58. Freeze the wiring only after every test passes (step 68).</text></svg>