<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Arial,Helvetica,sans-serif" stroke-linecap="round" stroke-linejoin="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah_2b9348" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b9348"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="500.0" y="30.0" font-size="20" font-weight="700" text-anchor="middle" fill="#1c2430" >DIAGRAM 2: ONE FLEX SENSOR (voltage divider)</text><line x1="120.0" y1="90.0" x2="430.0" y2="90.0" stroke="#d62828" stroke-width="4" stroke-linecap="round" /><text x="120.0" y="78.0" font-size="14" font-weight="700" text-anchor="start" fill="#d62828" >+3.3V   (ESP32 &quot;3V3&quot; pin)</text><circle cx="300.0" cy="90.0" r="4.5" fill="#d62828" stroke="none" stroke-width="1.5"/><line x1="300.0" y1="90.0" x2="300.0" y2="138.0" stroke="#1c2430" stroke-width="2" stroke-linecap="round" /><line x1="300.0" y1="202.0" x2="300.0" y2="250.0" stroke="#1c2430" stroke-width="2" stroke-linecap="round" /><rect x="289.0" y="138.0" width="22.0" height="64.0" rx="1" fill="#fff" stroke="#1c2430" stroke-width="2" /><line x1="280.0" y1="208.0" x2="320.0" y2="132.0" stroke="#1c2430" stroke-width="2" stroke-linecap="round" /><polygon points="320,132.0 309,134.0 315,143.0" fill="#1c2430"/><text x="332.0" y="155.0" font-size="14" font-weight="700" text-anchor="start" fill="#1c2430" >FLEX SENSOR</text><text x="332.0" y="173.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#5f6b7a" >~25 kΩ flat, higher when bent</text><text x="332.0" y="191.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#5f6b7a" >(tab 1 = supply, tab 2 = node)</text><line x1="300.0" y1="250.0" x2="300.0" y2="330.0" stroke="#2b9348" stroke-width="2.6" stroke-linecap="round" /><circle cx="300.0" cy="300.0" r="4.5" fill="#2b9348" stroke="none" stroke-width="1.5"/><text x="286.0" y="296.0" font-size="13" font-weight="700" text-anchor="end" fill="#2b9348" >ADC NODE</text><text x="286.0" y="312.0" font-size="11" font-weight="400" text-anchor="end" fill="#5f6b7a" >(junction)</text><line x1="300.0" y1="300.0" x2="300.0" y2="352.0" stroke="#1c2430" stroke-width="2" stroke-linecap="round" /><line x1="300.0" y1="398.0" x2="300.0" y2="450.0" stroke="#1c2430" stroke-width="2" stroke-linecap="round" /><rect x="289.0" y="352.0" width="22.0" height="46.0" rx="1" fill="#fff" stroke="#1c2430" stroke-width="2" /><text x="332.0" y="395.0" font-size="14" font-weight="700" text-anchor="start" fill="#1c2430" >10 kΩ  (brown-black-orange)</text><text x="332.0" y="413.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#5f6b7a" >fixed resistor, node to GND</text><line x1="300.0" y1="450.0" x2="300.0" y2="500.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round" /><line x1="120.0" y1="500.0" x2="430.0" y2="500.0" stroke="#1b1b1b" stroke-width="4" stroke-linecap="round" /><text x="120.0" y="524.0" font-size="14" font-weight="700" text-anchor="start" fill="#1c2430" >GND  (ESP32 &quot;GND&quot; pin)</text><circle cx="300.0" cy="500.0" r="4.5" fill="#1b1b1b" stroke="none" stroke-width="1.5"/><rect x="640.0" y="220.0" width="250.0" height="150.0" rx="8" fill="#eef2fb" stroke="#1f2f5c" stroke-width="2.4" /><text x="765.0" y="242.0" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2f5c" >ESP32</text><text x="765.0" y="258.0" font-size="11" font-weight="400" text-anchor="middle" fill="#5f6b7a" >ADC1 input</text><line x1="300.0" y1="300.0" x2="640.0" y2="300.0" stroke="#2b9348" stroke-width="3.2" stroke-linecap="round" marker-end="url(#ah_2b9348)" /><text x="470.0" y="290.0" font-size="12" font-weight="700" text-anchor="middle" fill="#2b9348" >ADC wire (green)</text><circle cx="640.0" cy="300.0" r="3.6" fill="#2b9348" stroke="none" stroke-width="1.5"/><text x="648.0" y="304.0" font-size="13" font-weight="700" text-anchor="start" fill="#1c2430" >GPIO36 (VP)</text><text x="765.0" y="330.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5f6b7a" >thumb example: GPIO36</text><text x="765.0" y="346.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5f6b7a" >pin label printed: VP</text><rect x="640.0" y="410.0" width="330.0" height="120.0" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="1.6" /><text x="805.0" y="475.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1c2430" >HOW IT WORKS</text><text x="656.0" y="448.0" font-size="12" font-weight="400" text-anchor="start" fill="#1c2430" >Vout = 3.3 V x 10k / (Rflex + 10k)</text><text x="656.0" y="463.6" font-size="12" font-weight="400" text-anchor="start" fill="#1c2430" >straight: Rflex low  -&gt; Vout HIGH</text><text x="656.0" y="479.2" font-size="12" font-weight="400" text-anchor="start" fill="#1c2430" >bent:     Rflex high -&gt; Vout LOW</text><text x="656.0" y="494.8" font-size="12" font-weight="400" text-anchor="start" fill="#1c2430" >ADC reads 0 - 4095 (12-bit)</text><rect x="40.0" y="560.0" width="900.0" height="60.0" rx="6" fill="#eef4ff" stroke="#1d4ed8" stroke-width="2" /><text x="50.0" y="580.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1c2430" >Only the ADC wire leaves the node. Nothing else is connected to the node except the sensor tab and the resistor.</text><text x="50.0" y="595.2" font-size="11.5" font-weight="400" text-anchor="start" fill="#1c2430" >Example numbers in the source PDF (about 3194 straight) are EXAMPLES. Use your own measurements.</text><rect x="430.0" y="100.0" width="6.0" height="6.0" rx="6" fill="#fff" stroke="#fff" stroke-width="1.6" /></svg>