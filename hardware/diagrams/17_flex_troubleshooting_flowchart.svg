<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1286" width="860" height="1286" font-family="Arial,Helvetica,sans-serif" stroke-linecap="round" stroke-linejoin="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah_c1121f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c1121f"/></marker><marker id="ah_1c2430" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2430"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="430.0" y="30.0" font-size="20" font-weight="700" text-anchor="middle" fill="#1c2430" >FLEX-SENSOR WIRING TROUBLESHOOTING FLOWCHART</text><text x="430.0" y="52.0" font-size="12" font-weight="400" text-anchor="middle" fill="#5f6b7a" >Measure the electrical supply BEFORE changing any code.</text><rect x="55.0" y="92.0" width="390.0" height="41.0" rx="20.5" fill="#e7f0ff" stroke="#1d4ed8" stroke-width="1.8" /><text x="250.0" y="117.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1c2430" >START: no / wrong ADC readings</text><line x1="250.0" y1="133.0" x2="250.0" y2="159.0" stroke="#1c2430" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah_1c2430)" /><rect x="55.0" y="161.0" width="390.0" height="56.0" rx="6" fill="#fff" stroke="#1c2430" stroke-width="1.6" /><text x="250.0" y="186.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1c2430" >Check ESP32 power</text><text x="250.0" y="201.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1c2430" >USB cable = data cable? power LED on? board boots?</text><line x1="250.0" y1="217.0" x2="250.0" y2="243.0" stroke="#1c2430" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah_1c2430)" /><rect x="55.0" y="245.0" width="390.0" height="56.0" rx="6" fill="#fff" stroke="#1c2430" stroke-width="1.6" /><text x="250.0" y="270.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1c2430" >Check GND continuity</text><text x="250.0" y="285.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1c2430" >ESP32 GND pin &gt; GND rail &gt; resistor bottom: multimeter beep</text><line x1="250.0" y1="301.0" x2="250.0" y2="327.0" stroke="#1c2430" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah_1c2430)" /><rect x="55.0" y="329.0" width="390.0" height="56.0" rx="6" fill="#fff" stroke="#1c2430" stroke-width="1.6" /><text x="250.0" y="354.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1c2430" >Check the 3.3 V rail</text><text x="250.0" y="369.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1c2430" >wire in the right hole? right half of the rail?</text><line x1="250.0" y1="385.0" x2="250.0" y2="411.0" stroke="#1c2430" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah_1c2430)" /><rect x="55.0" y="413.0" width="390.0" height="56.0" rx="6" fill="#fff" stroke="#1c2430" stroke-width="1.6" /><text x="250.0" y="438.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1c2430" >Measure voltage with a multimeter</text><text x="250.0" y="453.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1c2430" >red probe on the 3.3 V rail, black probe on the GND rail</text><line x1="250.0" y1="469.0" x2="250.0" y2="495.0" stroke="#1c2430" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah_1c2430)" /><polygon points="250,497 445.0,532.0 250,567 55.0,532.0" fill="#fff8e1" stroke="#b7791f" stroke-width="1.8"/><text x="250.0" y="529.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1c2430" >Is 3.3 V actually</text><text x="250.0" y="544.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1c2430" >present (3.2 - 3.4 V)?</text><line x1="250.0" y1="567.0" x2="250.0" y2="593.0" stroke="#1c2430" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah_1c2430)" /><text x="258.0" y="587.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1d8a45" >YES</text><line x1="445.0" y1="532.0" x2="485.0" y2="532.0" stroke="#c1121f" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah_c1121f)" /><text x="451.0" y="526.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#c1121f" >NO</text><rect x="485.0" y="490.0" width="330.0" height="84.0" rx="6" fill="#fff0f0" stroke="#c1121f" stroke-width="1.6" /><text x="495.0" y="510.0" font-size="12" font-weight="700" text-anchor="start" fill="#c1121f" >FIX POWER FIRST (do not touch the code)</text><text x="495.0" y="525.0" font-size="12" font-weight="400" text-anchor="start" fill="#c1121f" >Wrong hole / broken rail / D33 wire missing.</text><text x="495.0" y="540.0" font-size="12" font-weight="400" text-anchor="start" fill="#c1121f" >Re-check the sketch drives D33 HIGH (prototype).</text><text x="495.0" y="555.0" font-size="12" font-weight="400" text-anchor="start" fill="#c1121f" >Then measure again.</text><rect x="55.0" y="595.0" width="390.0" height="56.0" rx="6" fill="#fff" stroke="#1c2430" stroke-width="1.6" /><text x="250.0" y="620.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1c2430" >Check flex-sensor continuity</text><text x="250.0" y="635.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1c2430" >meter across the two tabs: ~25 k ohm flat, rising when bent</text><line x1="250.0" y1="651.0" x2="250.0" y2="677.0" stroke="#1c2430" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah_1c2430)" /><rect x="55.0" y="679.0" width="390.0" height="56.0" rx="6" fill="#fff" stroke="#1c2430" stroke-width="1.6" /><text x="250.0" y="704.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1c2430" >Check the resistor value</text><text x="250.0" y="719.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1c2430" >brown-black-orange = 10 k ohm. Remove it and measure it alone.</text><line x1="250.0" y1="735.0" x2="250.0" y2="761.0" stroke="#1c2430" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah_1c2430)" /><rect x="55.0" y="763.0" width="390.0" height="56.0" rx="6" fill="#fff" stroke="#1c2430" stroke-width="1.6" /><text x="250.0" y="788.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1c2430" >Check the ADC node</text><text x="250.0" y="803.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1c2430" >node voltage to GND: about 0.9 V straight. 0 V = no supply.</text><line x1="250.0" y1="819.0" x2="250.0" y2="845.0" stroke="#1c2430" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah_1c2430)" /><rect x="55.0" y="847.0" width="390.0" height="56.0" rx="6" fill="#fff" stroke="#1c2430" stroke-width="1.6" /><text x="250.0" y="872.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1c2430" >Check breadboard row placement</text><text x="250.0" y="887.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1c2430" >tabs in DIFFERENT rows; resistor top in the NODE row</text><line x1="250.0" y1="903.0" x2="250.0" y2="929.0" stroke="#1c2430" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah_1c2430)" /><rect x="55.0" y="931.0" width="390.0" height="56.0" rx="6" fill="#fff" stroke="#1c2430" stroke-width="1.6" /><text x="250.0" y="956.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1c2430" >Check the ESP32 ADC pin</text><text x="250.0" y="971.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1c2430" >node wire goes to GPIO36/39/34/35/32 (ADC1), not ADC2</text><line x1="250.0" y1="987.0" x2="250.0" y2="1013.0" stroke="#1c2430" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah_1c2430)" /><rect x="55.0" y="1015.0" width="390.0" height="56.0" rx="6" fill="#fff" stroke="#1c2430" stroke-width="1.6" /><text x="250.0" y="1040.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1c2430" >Read the ADC</text><text x="250.0" y="1055.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1c2430" >Serial Monitor, 115200 baud</text><line x1="250.0" y1="1071.0" x2="250.0" y2="1097.0" stroke="#1c2430" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah_1c2430)" /><polygon points="250,1099 445.0,1134.0 250,1169 55.0,1134.0" fill="#fff8e1" stroke="#b7791f" stroke-width="1.8"/><text x="250.0" y="1131.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1c2430" >Does bending change</text><text x="250.0" y="1146.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1c2430" >the value?</text><line x1="250.0" y1="1169.0" x2="250.0" y2="1195.0" stroke="#1c2430" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah_1c2430)" /><text x="258.0" y="1189.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1d8a45" >YES</text><line x1="445.0" y1="1134.0" x2="485.0" y2="1134.0" stroke="#c1121f" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah_c1121f)" /><text x="451.0" y="1128.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#c1121f" >NO</text><rect x="485.0" y="1099.5" width="330.0" height="69.0" rx="6" fill="#fff0f0" stroke="#c1121f" stroke-width="1.6" /><text x="495.0" y="1119.5" font-size="12" font-weight="700" text-anchor="start" fill="#c1121f" >Debug wiring / sensor</text><text x="495.0" y="1134.5" font-size="12" font-weight="400" text-anchor="start" fill="#c1121f" >Swap the sensor for a 10 k resistor:</text><text x="495.0" y="1149.5" font-size="12" font-weight="400" text-anchor="start" fill="#c1121f" >reading should be about 2000. Then fix the tab contact.</text><rect x="55.0" y="1197.0" width="390.0" height="41.0" rx="20.5" fill="#eaf7ee" stroke="#1d8a45" stroke-width="1.8" /><text x="250.0" y="1222.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1c2430" >PASS: flex channel works</text></svg>