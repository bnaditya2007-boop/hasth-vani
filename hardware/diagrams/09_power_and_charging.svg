<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 780" width="1180" height="780" font-family="Arial,Helvetica,sans-serif" stroke-linecap="round" stroke-linejoin="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah_1b1b1b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1b1b"/></marker><marker id="ah_d62828" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d62828"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="590.0" y="30.0" font-size="20" font-weight="700" text-anchor="middle" fill="#1c2430" >DIAGRAM 9: POWER AND CHARGING (one set per glove)</text><text x="590.0" y="50.0" font-size="12" font-weight="400" text-anchor="middle" fill="#5f6b7a" >LEFT and RIGHT gloves each have their own battery + TP4056 + switch + boost. Nothing is shared between gloves.</text><rect x="30.0" y="100.0" width="130.0" height="60.0" rx="8" fill="#fff" stroke="#1c2430" stroke-width="1.6" /><text x="95.0" y="128.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1c2430" >USB 5 V</text><text x="95.0" y="145.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5f6b7a" >charge input</text><rect x="230.0" y="90.0" width="220.0" height="250.0" rx="8" fill="#eef6ff" stroke="#1d4ed8" stroke-width="2.2" /><text x="340.0" y="112.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1d4ed8" >TP4056 charger</text><text x="340.0" y="128.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5f6b7a" >(version WITH protection)</text><text x="240.0" y="164.0" font-size="12" font-weight="700" text-anchor="start" fill="#1c2430" >IN+</text><text x="240.0" y="194.0" font-size="12" font-weight="700" text-anchor="start" fill="#1c2430" >IN-</text><text x="300.0" y="330.0" font-size="12" font-weight="700" text-anchor="middle" fill="#1c2430" >B+</text><text x="380.0" y="330.0" font-size="12" font-weight="700" text-anchor="middle" fill="#1c2430" >B-</text><text x="440.0" y="264.0" font-size="12" font-weight="700" text-anchor="end" fill="#1c2430" >OUT+</text><text x="440.0" y="314.0" font-size="12" font-weight="700" text-anchor="end" fill="#1c2430" >OUT-</text><line x1="160.0" y1="160.0" x2="230.0" y2="160.0" stroke="#d62828" stroke-width="3" stroke-linecap="round" marker-end="url(#ah_d62828)" /><line x1="160.0" y1="190.0" x2="230.0" y2="190.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round" marker-end="url(#ah_1b1b1b)" /><text x="195.0" y="152.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#d62828" >5 V</text><text x="195.0" y="208.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1c2430" >GND</text><rect x="230.0" y="410.0" width="220.0" height="110.0" rx="8" fill="#fff" stroke="#1c2430" stroke-width="2.2" /><text x="340.0" y="452.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1c2430" >3.7 V Li-ion cell</text><text x="340.0" y="470.0" font-size="11" font-weight="400" text-anchor="middle" fill="#5f6b7a" >3.0 V (empty) - 4.2 V (full)</text><line x1="300.0" y1="340.0" x2="300.0" y2="410.0" stroke="#d62828" stroke-width="3.4" stroke-linecap="round" /><line x1="380.0" y1="340.0" x2="380.0" y2="410.0" stroke="#1b1b1b" stroke-width="3.4" stroke-linecap="round" /><text x="288.0" y="432.0" font-size="22" font-weight="700" text-anchor="end" fill="#d62828" >+</text><text x="392.0" y="432.0" font-size="24" font-weight="700" text-anchor="start" fill="#1c2430" >-</text><text x="310.0" y="380.0" font-size="11" font-weight="700" text-anchor="start" fill="#d62828" >VBAT (+)</text><text x="392.0" y="380.0" font-size="11" font-weight="700" text-anchor="start" fill="#1c2430" >GND (-)</text><line x1="450.0" y1="260.0" x2="540.0" y2="260.0" stroke="#d62828" stroke-width="3.4" stroke-linecap="round" /><text x="495.0" y="250.0" font-size="11" font-weight="700" text-anchor="middle" fill="#d62828" >VBAT</text><circle cx="540.0" cy="260.0" r="4" fill="#fff" stroke="#1c2430" stroke-width="1.5"/><line x1="540.0" y1="260.0" x2="580.0" y2="242.0" stroke="#1c2430" stroke-width="3" stroke-linecap="round" /><circle cx="600.0" cy="260.0" r="4" fill="#fff" stroke="#1c2430" stroke-width="1.5"/><text x="570.0" y="226.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1c2430" >SWITCH (on/off)</text><line x1="600.0" y1="260.0" x2="690.0" y2="260.0" stroke="#d62828" stroke-width="3.4" stroke-linecap="round" /><rect x="690.0" y="190.0" width="200.0" height="180.0" rx="8" fill="#fff8e6" stroke="#b7791f" stroke-width="2.2" /><text x="790.0" y="212.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#8a5a00" >5 V BOOST module</text><text x="790.0" y="229.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5f6b7a" >(MT3608 etc.) recommended add-on</text><text x="700.0" y="264.0" font-size="12" font-weight="700" text-anchor="start" fill="#1c2430" >IN+</text><text x="700.0" y="314.0" font-size="12" font-weight="700" text-anchor="start" fill="#1c2430" >IN-</text><text x="880.0" y="264.0" font-size="12" font-weight="700" text-anchor="end" fill="#1c2430" >OUT+</text><text x="880.0" y="314.0" font-size="12" font-weight="700" text-anchor="end" fill="#1c2430" >OUT-</text><text x="790.0" y="352.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#c1121f" >set to 5.0 V, verify with multimeter</text><line x1="450.0" y1="310.0" x2="690.0" y2="310.0" stroke="#1b1b1b" stroke-width="3.4" stroke-linecap="round" /><text x="570.0" y="300.0" font-size="11" font-weight="700" text-anchor="middle" fill="#1c2430" >GND</text><circle cx="570.0" cy="310.0" r="4.5" fill="#1b1b1b" stroke="none" stroke-width="1.5"/><polyline points="890.0,310.0 940.0,310.0 940.0,390.0 1000.0,390.0" fill="none" stroke="#1b1b1b" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="940.0" cy="310.0" r="4.5" fill="#1b1b1b" stroke="none" stroke-width="1.5"/><line x1="940.0" y1="390.0" x2="940.0" y2="510.0" stroke="#1b1b1b" stroke-width="3.4" stroke-linecap="round" /><circle cx="940.0" cy="390.0" r="4.5" fill="#1b1b1b" stroke="none" stroke-width="1.5"/><circle cx="940.0" cy="510.0" r="4.5" fill="#1b1b1b" stroke="none" stroke-width="1.5"/><line x1="940.0" y1="510.0" x2="1000.0" y2="510.0" stroke="#1b1b1b" stroke-width="3.4" stroke-linecap="round" /><line x1="890.0" y1="264.0" x2="960.0" y2="264.0" stroke="#d62828" stroke-width="3.4" stroke-linecap="round" /><circle cx="960.0" cy="264.0" r="4.5" fill="#d62828" stroke="none" stroke-width="1.5"/><text x="925.0" y="254.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#d62828" >5 V rail</text><polyline points="960.0,264.0 960.0,330.0 1000.0,330.0" fill="none" stroke="#d62828" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah_d62828)"/><polyline points="960.0,330.0 960.0,460.0 1000.0,460.0" fill="none" stroke="#d62828" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah_d62828)"/><circle cx="960.0" cy="330.0" r="4.5" fill="#d62828" stroke="none" stroke-width="1.5"/><rect x="1000.0" y="210.0" width="160.0" height="220.0" rx="8" fill="#eef2fb" stroke="#1f2f5c" stroke-width="2.4" /><text x="1080.0" y="232.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2f5c" >ESP32 board</text><text x="1010.0" y="334.0" font-size="12" font-weight="700" text-anchor="start" fill="#1c2430" >VIN / 5V</text><text x="1010.0" y="394.0" font-size="12" font-weight="700" text-anchor="start" fill="#1c2430" >GND</text><text x="1080.0" y="262.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5f6b7a" >on-board regulator</text><text x="1080.0" y="276.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5f6b7a" >makes 3V3 for</text><text x="1080.0" y="290.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5f6b7a" >sensors, MPU, TFT</text><rect x="1000.0" y="440.0" width="160.0" height="100.0" rx="8" fill="#fff" stroke="#1c2430" stroke-width="2" /><text x="1080.0" y="466.0" font-size="13" font-weight="700" text-anchor="middle" fill="#1c2430" >MAX98357A</text><text x="1080.0" y="484.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5f6b7a" >VIN (RIGHT glove</text><text x="1080.0" y="498.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5f6b7a" >only) and GND</text><rect x="30.0" y="220.0" width="170.0" height="140.0" rx="6" fill="#fff" stroke="#9aa5b1" stroke-width="1.4" /><text x="40.0" y="240.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1c2430" >VOLTAGE RAILS</text><text x="40.0" y="260.0" font-size="11" font-weight="400" text-anchor="start" fill="#1c2430" >VBAT  3.0 - 4.2 V</text><text x="40.0" y="277.0" font-size="11" font-weight="400" text-anchor="start" fill="#1c2430" >VCHG  5 V (USB in)</text><text x="40.0" y="294.0" font-size="11" font-weight="400" text-anchor="start" fill="#1c2430" >V5    5 V (boost out)</text><text x="40.0" y="311.0" font-size="11" font-weight="400" text-anchor="start" fill="#1c2430" >3V3   3.3 V (ESP32)</text><text x="40.0" y="328.0" font-size="11" font-weight="400" text-anchor="start" fill="#1c2430" >GND   0 V common</text><text x="30.0" y="560.0" font-size="13" font-weight="700" text-anchor="start" fill="#1c2430" >COMMON GROUND: every module GND joins TP4056 OUT- / battery -</text><text x="30.0" y="590.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#5f6b7a" >WIRE COLOUR CODE (every wire is also text-labelled)</text><line x1="30.0" y1="606.0" x2="56.0" y2="606.0" stroke="#d62828" stroke-width="4" stroke-linecap="round" /><text x="62.0" y="610.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1c2430" >positive / supply</text><line x1="197.6" y1="606.0" x2="223.6" y2="606.0" stroke="#1b1b1b" stroke-width="4" stroke-linecap="round" /><text x="229.6" y="610.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1c2430" >GND</text><rect x="30.0" y="640.0" width="560.0" height="118.0" rx="6" fill="#fff0f0" stroke="#c1121f" stroke-width="2" /><text x="40.0" y="660.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#c1121f" >SAFETY</text><text x="40.0" y="678.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#c1121f" >1. Set the boost to 5.0 V with a multimeter BEFORE connecting any load.</text><text x="40.0" y="693.2" font-size="11.5" font-weight="400" text-anchor="start" fill="#c1121f" >2. Check battery and TP4056 polarity (+ to +, - to -) before connecting.</text><text x="40.0" y="708.4" font-size="11.5" font-weight="400" text-anchor="start" fill="#c1121f" >3. Never feed 5 V into a 3V3 pin. Never power a 3.3 V module from VBAT or 5 V.</text><text x="40.0" y="723.5" font-size="11.5" font-weight="400" text-anchor="start" fill="#c1121f" >4. Do not run USB and the boost into the ESP32 at the same time (VERIFY back-feed).</text><rect x="610.0" y="640.0" width="540.0" height="118.0" rx="6" fill="#fff7e0" stroke="#8a5a00" stroke-width="2" /><text x="620.0" y="660.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#8a5a00" >ITEM TO VERIFY</text><text x="620.0" y="678.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#8a5a00" >VERIFY EXACT MODULE POWER REQUIREMENTS BEFORE CONNECTION.</text><text x="620.0" y="693.2" font-size="11.5" font-weight="400" text-anchor="start" fill="#8a5a00" >A single 3.7 V cell is below what many ESP32 boards&#x27; VIN regulators need,</text><text x="620.0" y="708.4" font-size="11.5" font-weight="400" text-anchor="start" fill="#8a5a00" >so the source PDF recommends a 5 V boost (its Figure 15). The boost is NOT in</text><text x="620.0" y="723.5" font-size="11.5" font-weight="400" text-anchor="start" fill="#8a5a00" >the inventory: obtain one and confirm your ESP32 board&#x27;s VIN range.</text></svg>